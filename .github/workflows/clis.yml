        - {"nv":"alacritty@0.17.0","envs":{"CARGOGREEN_ADD_APT":"cmake,g++,libfontconfig1-dev,libxcb-xfixes0-dev,libxkbcommon-dev,pkg-config,python3"},"bin":"alacritty","sha1":"d9497ebe99dca6bdb2f334a722d68806eadc041b"}
        - {"nv":"cargo-rail@0.1.0","bin":"cargo-rail","sha1":"2f7e6c0acc7824c5e756325aa824058cc722a2e4"}
        - {"nv":"tract@0.22.1","bin":"tract","sha1":"cf7b09523efb5423f2360bbf4f471d15a1e7c3b3"}
        - {"nv":"marauder@master","args":"--git https://github.com/fenollp/reMarkable-tools.git --bin=whiteboard --tag=v0.6.0 --target=armv7-unknown-linux-musleabihf","envs":{"CARGO_TARGET_ARMV7_UNKNOWN_LINUX_MUSLEABIHF_LINKER":"arm-linux-gnueabihf-gcc","CARGOGREEN_ADD_APT":"gcc-arm-linux-gnueabihf,libc6-dev-armhf-cross,protobuf-compiler(>=3.6)"},"bin":"whiteboard","sha1":"d8d88b920276924a3a82d587c9642881c5bb48ff"}
    env:
    # CARGOGREEN_CACHE_FROM_IMAGES: docker-image://localhost:12345/${{ github.repository }}
    # CARGOGREEN_CACHE_TO_IMAGES: docker-image://localhost:23456/${{ github.repository }}
      CARGOGREEN_FINAL_PATH: recipes/${{ matrix.bin.nv }}.Dockerfile
      CARGOGREEN_EXPERIMENT: finalpathnonprimary # dumps on each build call
      CARGOGREEN_LOG: debug
      CARGOGREEN_LOG_PATH: logs.txt
    needs: bin
    steps:
    - name: Names
      # Same as as_install and slugify (hack/binaries.sh)
      run: |
        nv='${{ matrix.bin.nv }}'
        install=${nv%@main}
        install=${install%@master}
        slug=$(sed 's%@%_%g;s%+%_%g;s%\.%-%g;s%/%%g;s%:%%g' <<<"$nv")
        echo "INSTALL=$install" >>"$GITHUB_ENV"
        echo "CARGO_TARGET_DIR=/tmp/clis-$slug" >>"$GITHUB_ENV"
    - name: Cache the Rust toolchain
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.rustup/toolchains/
          ~/.rustup/update-hashes/
        key: ${{ github.job }}-${{ runner.os }}-rustup-${{ matrix.toolchain }}
    - name: Install the Rust toolchain
      # Not actions-rust-lang/setup-rust-toolchain: it would only add caching of target/ (cargo-green's job) and annotations
      run: |
        rustup toolchain install ${{ matrix.toolchain }} --profile minimal --no-self-update
        rustup default ${{ matrix.toolchain }}


    - name: Retrieve saved bin
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: cargo-green
        # Not the workspace: once checked out, ./cargo-green is the crate's directory
        path: /tmp/bin

    - name: Install saved bin
      shell: bash -eu {0}
      run: | # TODO: whence https://github.com/actions/download-artifact/issues/236
        chmod +x /tmp/bin/cargo-green
        /tmp/bin/cargo-green --version | grep cargo-green
        mv /tmp/bin/cargo-green ~/.cargo/bin/
  # - if: ${{ false }} # TODO: just-sync'd builder cache ends up >500MB (above artifacts free tier)
  #   name: Retrieve saved builder data
  #   uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
  #   with:
  #     name: builder-data
  #     path: /home/runner/builder-cache
  # - if: ${{ false }} # TODO: just-sync'd builder cache ends up >500MB (above artifacts free tier)
  #   run: |
  #     set -x
  #     sudo mkdir -p $(cargo green supergreen sync data 2>/dev/null)
  #     sudo mv -v /home/runner/builder-cache/* $(cargo green supergreen sync data 2>/dev/null)/
  #     sudo chown -R root:root $(cargo green supergreen sync data 2>/dev/null)
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: ./.github/actions/docker-login
      if: ${{ ! startsWith(github.ref, 'refs/heads/dependabot/') }}
      with:
        username: ${{ vars.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Cache `cargo fetch` (per CLI)
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
        key: ${{ github.job }}-${{ runner.os }}-cargo-deps-${{ matrix.bin.sha1 }}

    - name: Prepare local private registry cache
      if: ${{ env.CARGOGREEN_CACHE_FROM_IMAGES != '' || env.CARGOGREEN_CACHE_TO_IMAGES != '' }}
      run: |
        # https://github.com/fenollp/supergreen/actions/caches
        mkdir -p /tmp/.local-registry
        mkdir -p /tmp/.local-registry-new
    - name: 🔵 Restore local private registry cache
      if: ${{ env.CARGOGREEN_CACHE_FROM_IMAGES != '' || env.CARGOGREEN_CACHE_TO_IMAGES != '' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /tmp/.local-registry
        # github.run_id: https://github.com/actions/toolkit/issues/658#issuecomment-2640690759
        key: localprivatereg-${{ runner.os }}-${{ matrix.toolchain }}-${{ matrix.bin.nv }}-${{ github.run_id }}
        restore-keys: |
          localprivatereg-${{ runner.os }}-${{ matrix.toolchain }}-${{ matrix.bin.nv }}-
          localprivatereg-${{ runner.os }}-${{ matrix.toolchain }}-
          localprivatereg-${{ runner.os }}-
          localprivatereg-

    - name: Pull regist3 image
      if: ${{ env.CARGOGREEN_CACHE_FROM_IMAGES != '' || env.CARGOGREEN_CACHE_TO_IMAGES != '' }}
      run: |
        false \
        || docker build --tag regist3 - <<<'FROM docker.io/registry:3' \
        || docker build --tag regist3 - <<<'FROM mirror.gcr.io/registry:3' \
        || docker build --tag regist3 - <<<'FROM public.ecr.aws/docker/registry:3' \
        || exit 1
    - name: Start "cache from" image registry
      if: ${{ env.CARGOGREEN_CACHE_FROM_IMAGES != '' }}
      run: docker run --name=reg-from --rm --detach -p 12345:5000 --user $(id -u):$(id -g) -v     /tmp/.local-registry:/var/lib/registry regist3
    - name: Start "cache to" image registry
      if: ${{ env.CARGOGREEN_CACHE_TO_IMAGES != '' }}
      run: docker run --name=reg-to   --rm --detach -p 23456:5000 --user $(id -u):$(id -g) -v /tmp/.local-registry-new:/var/lib/registry regist3

    - name: Setup
      run: |
        if ! cargo green supergreen setup; then
            { cargo green supergreen setup 2>/dev/null || true; } | sudo /bin/sh -xe
        fi
    - name: 🔵 Envs
      run: cargo green supergreen env
    - if: ${{ matrix.toolchain != '1.96.0' }}
      run: cargo green supergreen show-rust-base 2>/dev/null | grep '${{ matrix.toolchain }}'
    - run: cargo green supergreen builder
    - name: 🔵 Envs again
      run: cargo green supergreen env

    - run: docker system df
    - run: docker system df --verbose
    - run: BUILDX_BUILDER=supergreen docker buildx du | head || true
    - run: BUILDX_BUILDER=supergreen docker buildx du | tail || true
    - run: BUILDX_BUILDER=supergreen docker buildx du --verbose
    - name: 🔵 ${{ matrix.bin.cargo || 'cargo' }} green install
      id: do-try
      timeout-minutes: 11
      continue-on-error: true
      run: |
        unset CARGO_PROFILE_DEV_DEBUG
        unset CARGO_REGISTRIES_CRATES_IO_PROTOCOL
        unset CARGO_TERM_COLOR
        unset CARGO_UNSTABLE_SPARSE_REGISTRY
        mapfile -t envs < <(jq -r '(. // {}) | to_entries[] | "\(.key)=\(.value)"' <<<'${{ toJSON(matrix.bin.envs) }}')
        env "${envs[@]}" \
          ${{ matrix.bin.cargo || 'cargo' }} green -vv install --locked --force --root=/tmp $INSTALL ${{ matrix.bin.args }} |& tee _
    - name: 🔵 ${{ matrix.bin.cargo || 'cargo' }} green install --jobs=1
      id: do-try-jobs1
      timeout-minutes: 11
      if: ${{ steps.do-try.outcome == 'failure' }}
      run: |
        unset CARGO_PROFILE_DEV_DEBUG
        unset CARGO_REGISTRIES_CRATES_IO_PROTOCOL
        unset CARGO_TERM_COLOR
        unset CARGO_UNSTABLE_SPARSE_REGISTRY
        mapfile -t envs < <(jq -r '(. // {}) | to_entries[] | "\(.key)=\(.value)"' <<<'${{ toJSON(matrix.bin.envs) }}')
        env "${envs[@]}" \
          ${{ matrix.bin.cargo || 'cargo' }} green -vv install --jobs=1 --locked --force --root=/tmp $INSTALL ${{ matrix.bin.args }} |& tee _ && printf '' >_
    - if: ${{ always() && matrix.toolchain != '1.96.0' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      name: Upload recipe
      with:
        name: ${{ matrix.bin.nv }}.Dockerfile
        path: ${{ env.CARGOGREEN_FINAL_PATH }}
        if-no-files-found: error
    - if: ${{ failure() }}
      name: 🔴 =means=> it's again that docker issue https://github.com/moby/buildkit/issues/5217
      run: |
        ! grep -C20 -F 'ResourceExhausted: grpc: received message larger than max' $CARGOGREEN_LOG_PATH

    - if: ${{ failure() }}
      name: 🔴 =means=> it's this HTTP/2 code = Unavailable desc = error reading from server-- connection error-- COMPRESSION_ERROR
      run: |
        ! grep -C20 -F 'connection error: COMPRESSION_ERROR' $CARGOGREEN_LOG_PATH

    - if: ${{ !cancelled() }}
      name: 🔴 =means=> there's some panic!s
      run: |
        ! grep -C20 -F ' panicked at ' $CARGOGREEN_LOG_PATH

    - if: ${{ !cancelled() }}
      name: 🔴 =means=> there's some BUGs
      run: |
        ! grep -C20 -F 'BUG: ' $CARGOGREEN_LOG_PATH

    - if: ${{ failure() }}
      name: 🔴 =means=> here's cargo's error text
      run: |
        ! grep -C20 -E '-[a-f0-9]{16} [eE]rror:' $CARGOGREEN_LOG_PATH _

    - if: ${{ failure() }}
      name: 🔴 =means=> 429 Too Many Requests
      run: |
        ! grep -C20 -F '429 Too Many Requests' $CARGOGREEN_LOG_PATH _

    - if: ${{ failure() }}
      name: 🔴 =means=> here's relevant logs
      run: |
        ! grep -C20 -F ' >>> ' $CARGOGREEN_LOG_PATH

    - if: ${{ always() && env.CARGOGREEN_FINAL_PATH != '' }}
      name: 🌀 Maybe show final path diff
      run: |
        final_diff=(git --no-pager diff)
        if [[ ${{ matrix.toolchain }} != 1.96.0 ]]; then
          final_diff+=(--exit-code)
        fi
        final_diff+=(--ignore-matching-lines='^# Generated by')  # Helps not fail CI after tagging
        final_diff+=(--ignore-matching-lines=' AS rust-base$')
        final_diff+=(-- $CARGOGREEN_FINAL_PATH)
        "${final_diff[@]}"

    - if: ${{ failure() }}
      name: 🌀 cargo-green logs
      run: tail -n9999999 $CARGOGREEN_LOG_PATH ; echo >$CARGOGREEN_LOG_PATH
    - run: docker system df
    - run: docker system df --verbose
    - run: BUILDX_BUILDER=supergreen docker buildx du | head || true
    - run: BUILDX_BUILDER=supergreen docker buildx du | tail || true
    - run: BUILDX_BUILDER=supergreen docker buildx du --verbose
    - name: Target dir disk usage
      if: ${{ always() }}
      run: du -sh $CARGO_TARGET_DIR || true
