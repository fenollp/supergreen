        - {"nv":"cargo-c@0.10.18+cargo-0.92.0","args":"--bin=cargo-cbuild","envs":{"CARGOGREEN_ADD_APT":"libcurl4-openssl-dev,libssl-dev(=3.5.9-1~deb13u1),pkg-config"},"bin":"cargo-cbuild","sha1":"ef48357e69cd9fa0a835d94eaf03892e7dd0957d"}
