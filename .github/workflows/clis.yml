    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -euo pipefail {0}
    name: ${{ matrix.bin.nv }} ${{ matrix.toolchain }}
    continue-on-error: ${{ matrix.toolchain != '1.96.0' }}
