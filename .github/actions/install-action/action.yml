name: Install tool
description: >-
  Installs a prebuilt tool with taiki-e/install-action. The one place where that action is pinned:
  dependabot bumps it here (see `directories` in .github/dependabot.yml).

inputs:
  tool:
    description: Tool(s) to install, as taiki-e/install-action reads them (comma-separated, optionally `name@version`).
    required: true

runs:
  using: composite
  steps:
  - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
    with:
      tool: ${{ inputs.tool }}
